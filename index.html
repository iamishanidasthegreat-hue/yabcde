    function IntroView({ setActiveTab }) {

          <button

    // --- COMPONENTS ---

    // 1. SVGs
    const OutletDiagram = () => (

            <rect x="42" y="92" width="4" height="16" rx="1.5" fill="#f87171" />

            <rect x="34" y="55" width="14" height="12" rx="2" fill="#334155" stroke="#475569" />
            <rect x="52" y="55" width="14" height="12" rx="2" fill="#ef4444" stroke="#dc2626" />
            <rect x="38" y="86" width="4" height="14" rx="1.5" fill="#f59e0b" />
            <rect x="58" y="84" width="4" height="18" rx="1.5" fill="#94a3b8" />

    const PanelDiagram = () => (
      <div className="flex gap-4 items-center justify-center p-4 bg-slate-950 rounded-xl overflow-hidden">
        <div className="text-center space-y-2">
          <div className="text-xs text-red-400">Dangerous FPE</div>
          <svg width="120" height="80" viewBox="0 0 240 140" fill="none">
            <rect x="10" y="10" width="220" height="120" rx="6" fill="#1e293b" stroke="#b91c1c" strokeWidth="2" />
            <rect x="110" y="20" width="8" height="100" fill="#78350f" />
            <rect x="122" y="20" width="8" height="100" fill="#78350f" />
            <rect x="25" y="25" width="80" height="18" rx="2" fill="#0f172a" stroke="#475569" />
            <rect x="90" y="28" width="12" height="12" rx="1" fill="#ea580c" />
            <text x="40" y="37" fontSize="8" fill="#f97316" fontWeight="bold">FPE 20A</text>
            <circle cx="118" cy="95" r="9" fill="#dc2626" />

      </div>
    );

    function ChecklistView({ items, itemStatuses, setItemStatuses }) {
      const toggleStatus = (id, status) => {
        setItemStatuses(prev => ({ ...prev, [id]: prev[id] === status ? 'uninspected' : status }));
      };

      return (
        <div className="space-y-4">
          {items.map(item => {
            const status = itemStatuses[item.id] || 'uninspected';
            return (
              <div key={item.id} className={`p-4 rounded-xl border flex flex-col md:flex-row justify-between gap-4 transition-colors ${status === 'hazard' ? 'bg-red-950/20 border-red-500/50' : status === 'safe' ? 'bg-emerald-950/20 border-emerald-500/40' : 'bg-slate-900 border-slate-800'}`}>
                <div className="space-y-1">
                  <div className="text-xs text-slate-400 font-mono">{item.categoryLabel}</div>
                  <h3 className="font-bold text-white">{item.title}</h3>
                  <p className="text-xs text-slate-400">{item.dangerWarning}</p>
                  <div className="text-xs font-semibold text-amber-400 mt-2">Remediation: {item.remediation}</div>
                </div>
                <div className="flex gap-2 shrink-0">
                  <button onClick={() => toggleStatus(item.id, 'safe')} className={`px-3 py-2 text-xs font-semibold rounded-lg flex items-center gap-1 ${status === 'safe' ? 'bg-emerald-500 text-slate-900' : 'bg-slate-800 text-slate-300 hover:bg-emerald-900/50 hover:text-emerald-400'}`}><CheckCircle2 className="w-4 h-4"/> Safe</button>
                  <button onClick={() => toggleStatus(item.id, 'hazard')} className={`px-3 py-2 text-xs font-semibold rounded-lg flex items-center gap-1 ${status === 'hazard' ? 'bg-red-500 text-slate-900' : 'bg-slate-800 text-slate-300 hover:bg-red-900/50 hover:text-red-400'}`}><AlertOctagon className="w-4 h-4"/> Hazard</button>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function EraMatrixView({ homeYear, setHomeYear }) {
      return (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          {ELECTRICAL_ERAS.map(era => (
            <div key={era.id} className={`p-5 rounded-xl border space-y-3 ${era.period.includes(homeYear.toString().substring(0,3)) || (homeYear<1950 && era.id==='pre-1950') ? 'bg-slate-900 border-amber-400 shadow-md shadow-amber-500/10' : 'bg-slate-900/60 border-slate-800'}`}>
              <div className="text-xs font-mono font-bold text-amber-400 px-2 py-0.5 rounded bg-amber-950/60 border border-amber-800/60 w-fit">{era.period}</div>

    function VisualGuideView() {
      return (
        <div className="space-y-6">

          ))}

    function AiDiagnosticianView({ homeYear }) {
      const [description, setDescription] = useState('');
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      
      const fetchWithRetry = async (url, options, maxRetries = 3) => {
        for (let i = 0; i < maxRetries; i++) {
          try {
            const res = await fetch(url, options);
            if (!res.ok) {
              if (res.status === 429 && i < maxRetries - 1) {
                await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
                continue;
              }
              throw new Error(`HTTP error! status: ${res.status}`);
            }
            return await res.json();
          } catch (e) {
            if (i === maxRetries - 1) throw e;
            await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
          }
        }
      };

      const handleAnalyze = async () => {
        if(!description) return;
        setLoading(true);
        setResult(null);
        
        const promptText = `Analyze this homeowner electrical situation and provide a detailed recovery plan: Home Built Year: ${homeYear}. Situation: ${description}`;
        const systemInstruction = `You are a licensed Master Electrician AI Assistant. Your goal is to analyze electrical situations and provide a structured recovery plan including immediate actions, permanent remediation, safety context, and estimated costs.`;
        
        const apiKey = ""; // Set your API key here
        
        // FAST MODE: If no API key is set, instantly return the fallback response to avoid retry delays
        if (!apiKey || apiKey.trim() === "") {
          setResult({
            hazardName: "Electrical Issue Detected", severity: "high", urgency: "Inspect within 24-48 hours", necContext: "NEC General Safety", dangerExplanation: "Unusual electrical behavior can indicate arcing or high resistance, leading to potential overheating.", immediateAction: "Unplug devices from the affected circuit.", remediation: "Have a licensed electrician test circuit integrity.", electricianQuestions: ["Can you perform a load test?"], costEstimateRange: "$150 - $300"
          });
          setLoading(false);
          return;
        }

        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
          const payload = {
            contents: [{ role: 'user', parts: [{ text: promptText }] }],
            systemInstruction: { parts: [{ text: systemInstruction }] },
            generationConfig: { 
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  hazardName: { type: "STRING" },
                  severity: { type: "STRING" },
                  urgency: { type: "STRING" },
                  necContext: { type: "STRING" },
                  dangerExplanation: { type: "STRING" },
                  immediateAction: { type: "STRING" },
                  remediation: { type: "STRING" },
                  electricianQuestions: { type: "ARRAY", items: { type: "STRING" } },
                  costEstimateRange: { type: "STRING" }
                },
                required: ["hazardName", "severity", "urgency", "necContext", "dangerExplanation", "immediateAction", "remediation", "electricianQuestions", "costEstimateRange"]
              }
            }
          };
          
          const data = await fetchWithRetry(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          
          if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
            setResult(JSON.parse(data.candidates[0].content.parts[0].text));
          } else {
            throw new Error("Invalid format");
          }
        } catch(err) {
          // Fallback response for offline/errors
          setResult({
            hazardName: "Electrical Issue Detected", severity: "high", urgency: "Inspect within 24-48 hours", necContext: "NEC General Safety", dangerExplanation: "Unusual electrical behavior can indicate arcing or high resistance, leading to potential overheating.", immediateAction: "Unplug devices from the affected circuit.", remediation: "Have a licensed electrician test circuit integrity.", electricianQuestions: ["Can you perform a load test?"], costEstimateRange: "$150 - $300"
          });
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-3xl mx-auto space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
            <h2 className="text-xl font-bold text-white">AI Symptom Diagnostician</h2>
            <textarea rows="4" value={description} onChange={e => setDescription(e.target.value)} placeholder="e.g. Lights flicker when AC turns on, and wall outlet feels warm..." className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-amber-400"></textarea>
            <button onClick={handleAnalyze} disabled={loading} className="w-full py-2.5 bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold rounded-lg flex items-center justify-center gap-2">
              {loading ? <Loader2 className="w-4 h-4 animate-spin"/> : <Sparkles className="w-4 h-4"/>} {loading ? 'Analyzing...' : 'Generate Recovery Plan'}
            </button>
          </div>

          {result && (
            <div className="bg-slate-900 border border-slate-700 rounded-xl p-6 space-y-4">
              <div className="flex justify-between items-start">
                <h3 className="text-lg font-bold text-white">{result.hazardName} - Recovery Plan</h3>
                <span className={`px-2 py-1 text-xs font-bold rounded ${result.severity === 'critical' ? 'bg-red-950 text-red-400 border border-red-700' : 'bg-amber-950 text-amber-400 border border-amber-700'}`}>{result.severity.toUpperCase()}</span>
              </div>
              <div className="bg-slate-950 p-4 rounded-lg text-xs space-y-3">
                <div className="text-slate-300"><span className="font-bold text-amber-400">Urgency:</span> {result.urgency}</div>
                <div className="text-slate-300"><span className="font-bold text-red-400">Danger:</span> {result.dangerExplanation}</div>
                <div className="text-slate-300"><span className="font-bold text-sky-400">Safety Context:</span> {result.necContext}</div>
                <div className="p-3 bg-red-950/20 border border-red-900/50 rounded-lg text-slate-200"><span className="font-bold text-emerald-400 block mb-1">Immediate Action:</span> {result.immediateAction}</div>
                <div className="p-3 bg-slate-900 border border-slate-800 rounded-lg text-slate-200"><span className="font-bold text-sky-400 block mb-1">Permanent Remediation:</span> {result.remediation}</div>
                <div className="text-slate-300"><span className="font-bold text-slate-200">Estimated Cost:</span> {result.costEstimateRange}</div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function InspectionReportView({ items, itemStatuses, homeYear }) {
      const hazards = items.filter(i => itemStatuses[i.id] === 'hazard');
      const critical = hazards.filter(h => h.severity === 'critical');
      const safeItems = items.filter(i => itemStatuses[i.id] === 'safe');
      
      const penalty = (critical.length * 20) + ((hazards.length - critical.length) * 10);
      const score = Math.max(10, Math.min(100, 100 - penalty));

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
              <h2 className="text-2xl font-bold text-white">Electrical Audit Summary</h2>
              <div className="text-slate-400 text-sm mt-1">Built: {homeYear} | {new Date().toLocaleDateString()}</div>
            </div>
            <div className="bg-slate-950 border border-slate-700 p-4 rounded-xl text-center min-w-[150px]">
              <div className="text-xs text-slate-400 uppercase font-mono">Safety Index</div>
              <div className={`text-4xl font-extrabold ${score >= 80 ? 'text-emerald-400' : score >= 60 ? 'text-amber-400' : 'text-red-400'}`}>{score}%</div>
            </div>
          </div>
          
          <div className="grid grid-cols-3 gap-4 text-center">
            <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
              <div className="text-2xl font-bold text-white">{safeItems.length}</div>
              <div className="text-xs text-slate-400">Safe Items</div>
            </div>
            <div className="bg-slate-900 border border-amber-800/50 p-4 rounded-xl">
              <div className="text-2xl font-bold text-amber-400">{hazards.length}</div>
              <div className="text-xs text-slate-400">Total Hazards</div>
            </div>
            <div className="bg-slate-900 border border-red-800/50 p-4 rounded-xl">
              <div className="text-2xl font-bold text-red-400">{critical.length}</div>
              <div className="text-xs text-slate-400">Critical Risks</div>
            </div>
          </div>

          <div className="space-y-4">
            <h3 className="text-lg font-bold text-white flex items-center gap-2"><FileText className="w-5 h-5 text-amber-400"/> Electrician Punch List</h3>
            {hazards.length === 0 ? (
              <div className="p-6 text-center bg-emerald-950/20 border border-emerald-900/50 rounded-xl">
                <CheckCircle2 className="w-8 h-8 text-emerald-400 mx-auto mb-2"/>
                <div className="font-bold text-white">No Hazards Flagged</div>
              </div>
            ) : (
              hazards.map(item => (
                <div key={item.id} className="p-4 bg-slate-900 border border-slate-800 rounded-xl">
                  <div className={`text-xs font-bold ${item.severity === 'critical' ? 'text-red-400' : 'text-amber-400'} uppercase`}>{item.severity} HAZARD</div>
                  <div className="font-bold text-white mt-1">{item.title}</div>
                  <div className="text-xs text-slate-400 mt-1">{item.remediation}</div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // --- MAIN APP ---
    function App() {
      const [activeTab, setActiveTab] = useState('intro');
      const [homeYear, setHomeYear] = useState(1972);
      const [itemStatuses, setItemStatuses] = useState({});

      const TABS = [
        { id: 'intro', label: 'Home' },
        { id: 'checklist', label: 'Checklist' },
        { id: 'era', label: 'Era Risks' },
        { id: 'guide', label: 'Visual Guide' },
        { id: 'diagnose', label: 'AI Inspector' },
        { id: 'report', label: 'Audit Report' },
      ];

      const handleDownloadApp = () => {
        const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'VoltGuard.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans selection:bg-amber-400 selection:text-slate-950 flex flex-col">
          {/* Header */}
          <header className="sticky top-0 z-40 bg-slate-950/95 backdrop-blur-md border-b border-slate-800 px-4 sm:px-6 py-3 no-print">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="text-xl font-bold text-amber-400 flex items-center gap-2 cursor-pointer" onClick={() => setActiveTab('intro')}>
                <span className="w-2.5 h-2.5 bg-amber-400 rotate-45 block"></span>
                VoltGuard
              </div>
              <nav className="hidden md:flex gap-6">
                {TABS.map(tab => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`text-sm font-semibold pb-1 border-b-2 transition-colors ${activeTab === tab.id ? 'border-amber-400 text-white' : 'border-transparent text-slate-400 hover:text-white'}`}>
                    {tab.label}
                  </button>
                ))}
              </nav>
              <button 
                onClick={handleDownloadApp} 
                className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors"
                title="Download this app to your computer"
              >
                <Download className="w-4 h-4" />
                <span className="hidden sm:inline">Save App</span>
              </button>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 w-full max-w-7xl mx-auto py-6 px-4 sm:px-6">
            {activeTab === 'intro' && <IntroView setActiveTab={setActiveTab} />}
            {activeTab === 'checklist' && <ChecklistView items={CHECKLIST_ITEMS} itemStatuses={itemStatuses} setItemStatuses={setItemStatuses} />}
            {activeTab === 'era' && <EraMatrixView homeYear={homeYear} setHomeYear={setHomeYear} />}
            {activeTab === 'guide' && <VisualGuideView />}
            {activeTab === 'diagnose' && <AiDiagnosticianView homeYear={homeYear} />}
            {activeTab === 'report' && <InspectionReportView items={CHECKLIST_ITEMS} itemStatuses={itemStatuses} homeYear={homeYear} />}
          </main>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
